<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デフォルト拠点 一括登録ツール</title>
<style>
  body{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; max-width:640px; margin:20px auto; padding:0 14px; color:#333;}
  h1{font-size:1.15rem;}
  .box{border:1px solid #ddd; border-radius:10px; padding:14px; margin-top:12px; background:#fafaf8;}
  label{display:block; padding:6px 0; font-size:.95rem;}
  button{padding:10px 18px; border:none; border-radius:8px; background:#2c6e49; color:#fff; font-size:1rem; cursor:pointer; margin-top:10px;}
  button:disabled{opacity:.5;}
  #log{white-space:pre-wrap; font-size:.85rem; background:#222; color:#9f9; padding:10px; border-radius:8px; margin-top:12px; min-height:80px;}
  .warn{font-size:.8rem; color:#a33; margin-top:8px;}
</style>
</head>
<body>
<h1>デフォルト拠点 一括登録ツール</h1>
<p style="font-size:.88rem;">対象範囲：熊本市（西区・南区・中央区・東区）から八代市までの帯（宇土市・宇城市・美里町・嘉島町・御船町・氷川町・八代市を含む概略範囲）。OpenStreetMapから施設を取得し、生活情報マップの共有拠点として登録します。登録済み（同じOSM ID）の施設はスキップされます。</p>

<div class="box">
  <label><input type="checkbox" id="g_bousai" checked> 🏫 防災拠点候補（役場・市役所・公民館・体育館）</label>
  <label><input type="checkbox" id="g_medical" checked> 🏥 医療機関（病院・診療所）</label>
  <label><input type="checkbox" id="g_gas" checked> ⛽ ガソリンスタンド</label>
  <label><input type="checkbox" id="g_super"> 🛒 スーパー・コンビニ・ドラッグストア（件数が多いので任意）</label>
  <button id="preview">1. 件数を確認（プレビュー）</button>
  <button id="register" disabled>2. Firestoreに登録する</button>
  <div class="warn">※「防災拠点候補」は公共施設を機械的に取得したものです。実際の指定避難所かどうかは自治体の公式情報をご確認ください。</div>
</div>
<div id="log">待機中…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, writeBatch, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCfcSnE9-MwiGfLijIevVUqbfxGcfFcHdo",
  authDomain: "r8-kumamoto-map.firebaseapp.com",
  projectId: "r8-kumamoto-map",
  storageBucket: "r8-kumamoto-map.firebasestorage.app",
  messagingSenderId: "372510038111",
  appId: "1:372510038111:web:66dbce59527f052c8be3ea"
};
const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);

// 概略範囲：南32.40 西130.42 北32.84 東130.95
const BB = "32.40,130.42,32.84,130.95";
const GROUPS = {
  bousai: {genre:"bousai", q:`nwr["amenity"~"^(townhall|community_centre)$"](${BB});nwr["leisure"="sports_centre"](${BB});`},
  medical:{genre:"medical", q:`nwr["amenity"~"^(hospital|clinic)$"](${BB});`},
  gas:    {genre:"gas", q:`nwr["amenity"="fuel"](${BB});`},
  super:  {genre:"super", q:`nwr["shop"~"^(supermarket|convenience|chemist)$"](${BB});`}
};

const logEl = document.getElementById("log");
function log(msg){ logEl.textContent += "\n" + msg; }
function selectedKeys(){ return Object.keys(GROUPS).filter(k=>document.getElementById("g_"+k).checked); }

let candidates = [];

async function fetchGroup(key){
  const g = GROUPS[key];
  const q = `[out:json][timeout:60];(${g.q});out center 1500;`;
  const res = await fetch("https://overpass-api.de/api/interpreter", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"data=" + encodeURIComponent(q)
  });
  if(!res.ok) throw new Error("Overpass HTTP " + res.status);
  const json = await res.json();
  return (json.elements || []).map(el=>{
    const lat = el.lat !== undefined ? el.lat : (el.center && el.center.lat);
    const lng = el.lon !== undefined ? el.lon : (el.center && el.center.lon);
    const name = (el.tags && (el.tags.name || el.tags.brand)) || null;
    return {osmId:"osm-"+el.type+"-"+el.id, name, genre:g.genre, lat, lng};
  }).filter(s=>s.name && typeof s.lat==="number" && typeof s.lng==="number");
}

document.getElementById("preview").onclick = async ()=>{
  logEl.textContent = "取得中…（数十秒かかることがあります）";
  candidates = [];
  try{
    for(const key of selectedKeys()){
      const list = await fetchGroup(key);
      log(`${key}: ${list.length}件`);
      candidates = candidates.concat(list);
    }
    // 既存拠点のosmIdを取得して重複除外
    const snap = await getDocs(collection(db, "spots"));
    const existing = new Set(snap.docs.map(d=>d.data().osmId).filter(Boolean));
    const before = candidates.length;
    candidates = candidates.filter(c=>!existing.has(c.osmId));
    log(`合計 ${before}件 → 登録済み除外後 ${candidates.length}件`);
    log("内容が良ければ「2. Firestoreに登録する」を押してください。");
    document.getElementById("register").disabled = candidates.length === 0;
  }catch(e){ log("エラー: " + e.message); }
};

document.getElementById("register").onclick = async ()=>{
  if(!candidates.length) return;
  if(!confirm(candidates.length + "件を登録します。よろしいですか？")) return;
  document.getElementById("register").disabled = true;
  try{
    let done = 0;
    for(let i=0; i<candidates.length; i+=400){
      const batch = writeBatch(db);
      candidates.slice(i, i+400).forEach(c=>{
        batch.set(doc(collection(db,"spots")),
          {name:c.name.slice(0,50), genre:c.genre, lat:c.lat, lng:c.lng, osmId:c.osmId, createdAt:serverTimestamp()});
      });
      await batch.commit();
      done += Math.min(400, candidates.length - i);
      log(`${done}/${candidates.length} 件登録済み…`);
    }
    log("✅ 完了しました。マップを開いて確認してください。");
  }catch(e){ log("エラー: " + e.message); }
};
</script>
</body>
</html>
