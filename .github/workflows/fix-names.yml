name: fix-spot-names

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-names.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 識別子を町名に置き換え
        run: node scripts/fix-names.mjs
      - name: 変更があればコミット
        run: |
          git config user.name "spots-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "拠点名の識別子を町名に置き換え"
            git pull --rebase origin main
            git push
          fi
